spring:
  application:
    name: smartpay-risk-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartpay_db}?currentSchema=risk
    username: ${DB_USER:smartpay}
    password: ${DB_PASS:smartpay}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: risk
    open-in-view: false

  flyway:
    enabled: true
    create-schemas: true
    schemas: risk
    default-schema: risk
    locations: classpath:db/migration

server:
  port: 8086
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

grpc:
  server:
    enabled: true
    port: ${GRPC_SERVER_PORT:9091}
