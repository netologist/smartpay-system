apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartpay-invoice-service
  namespace: smartpay
  labels:
    app.kubernetes.io/name: smartpay-invoice-service
    app.kubernetes.io/component: invoice-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: smartpay-invoice-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smartpay-invoice-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: invoice
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: ghcr.io/hozgan/smartpay/smartpay-invoice-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: smartpay-common-config
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres.smartpay.svc.cluster.local:5432/smartpay_db"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smartpay-db-app-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartpay-db-app-credentials
                  key: password
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: smartpay-invoice-service
  namespace: smartpay
  labels:
    app.kubernetes.io/name: smartpay-invoice-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: smartpay-invoice-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
