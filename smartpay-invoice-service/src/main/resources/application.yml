spring:
  application:
    name: smartpay-invoice-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartpay_db}?currentSchema=invoice
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    create-schemas: true
    schemas: invoice
    default-schema: invoice
    locations:
      - classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: invoice
        format_sql: false
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 25

server:
  port: 8083
  shutdown: graceful

smartpay:
  pricing:
    default-currency: GBP
    fuel-surcharge-rate: 0.12
    vat-rate: 0.20
    rates-per-mile:
      ARTIC: 3.50
      SEVEN_POINT_FIVE_TONNE: 2.50
      LUTON: 2.00
      VAN: 1.50

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.hozgan.smartpay.invoice: INFO
    org.flywaydb: INFO
    org.springframework.transaction: WARN
