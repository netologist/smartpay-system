spring:
  application:
    name: smartpay-recon-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartpay_db}?currentSchema=recon
    username: ${DB_USER:smartpay}
    password: ${DB_PASS:smartpay}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: recon

  flyway:
    enabled: true
    create-schemas: true
    schemas: recon
    default-schema: recon
    locations: classpath:db/migration
    baseline-on-migrate: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

smartpay:
  recon:
    ledger-grpc-host: ${LEDGER_GRPC_HOST:localhost}
    ledger-grpc-port: ${LEDGER_GRPC_PORT:9090}
