syntax = "proto3";

package smartpay.risk;

import "common.proto";

option java_multiple_files = true;
option java_package = "com.hozgan.smartpay.proto.risk";
option java_outer_classname = "RiskProto";

service RiskService {
  // Evaluates carrier credit risk, factoring ceilings, and fraud propensity
  rpc EvaluateCarrierRisk (EvaluateCarrierRiskRequest) returns (EvaluateCarrierRiskResponse);
}

enum RiskTierProto {
  RISK_TIER_UNSPECIFIED = 0;
  LOW = 1;
  MEDIUM = 2;
  HIGH = 3;
  CRITICAL = 4;
}

message EvaluateCarrierRiskRequest {
  string carrier_id = 1;
  string shipper_id = 2;
  smartpay.common.MoneyProto invoice_amount = 3;
  // Optional contextual fields for advanced fraud heuristics
  optional int64 invoice_created_at_epoch_ms = 4;
  optional int64 epod_verified_at_epoch_ms = 5;
  optional string client_ip = 6;
  optional string bank_account_number = 7;
}

message EvaluateCarrierRiskResponse {
  string carrier_id = 1;
  int32 risk_score = 2; // 0 to 100
  RiskTierProto risk_tier = 3;
  bool approved = 4;
  string reasoning = 5;
}
