apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: smartpay

resources:
  - ../../base
  - hpa.yaml
  - pdb.yaml

labels:
  - pairs:
      environment: prod

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: smartpay-gateway
      spec:
        replicas: 3
    target:
      kind: Deployment
      name: smartpay-gateway
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: smartpay-ledger-service
      spec:
        replicas: 3
    target:
      kind: Deployment
      name: smartpay-ledger-service
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: smartpay-payment-service
      spec:
        replicas: 3
    target:
      kind: Deployment
      name: smartpay-payment-service
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: smartpay-invoice-service
      spec:
        replicas: 3
    target:
      kind: Deployment
      name: smartpay-invoice-service
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: smartpay-payout-worker
      spec:
        replicas: 3
    target:
      kind: Deployment
      name: smartpay-payout-worker
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: smartpay-recon-service
      spec:
        replicas: 3
    target:
      kind: Deployment
      name: smartpay-recon-service
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: smartpay-risk-service
      spec:
        replicas: 3
    target:
      kind: Deployment
      name: smartpay-risk-service
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: smartpay-notification-service
      spec:
        replicas: 3
    target:
      kind: Deployment
      name: smartpay-notification-service
