spring:
  datasource:
    # Overridden by @ServiceConnection / Testcontainers at runtime — fallback only.
    url: jdbc:tc:postgresql:16-alpine:///smartpay_invoice_test
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 30000

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    create-schemas: true
    schemas: invoice
    default-schema: invoice
    locations:
      - classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_schema: invoice
        format_sql: true

smartpay:
  pricing:
    default-currency: GBP
    fuel-surcharge-rate: 0.12
    vat-rate: 0.20
    rates-per-mile:
      ARTIC: 3.50
      SEVEN_POINT_FIVE_TONNE: 2.50
      LUTON: 2.00
      VAN: 1.50

logging:
  level:
    com.hozgan.smartpay.invoice: DEBUG
    org.springframework.transaction: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO
