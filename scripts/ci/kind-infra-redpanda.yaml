# ==============================================================================
# Ephemeral KinD Infrastructure: Redpanda (Single-Node Kafka Wire-Compatible Broker)
# Pattern: Proven configuration from vrp-system
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: smartpay
  labels:
    app: redpanda
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/part-of: smartpay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v24.2.4
          command:
            - redpanda
            - start
            - --overprovisioned
            - --smp=1
            - --memory=512M
            - --reserve-memory=0M
            - --node-id=0
            - --check=false
            - --kafka-addr=PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr=PLAINTEXT://redpanda.smartpay.svc.cluster.local:9092
          ports:
            - containerPort: 9092
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: smartpay
  labels:
    app: redpanda
spec:
  selector:
    app: redpanda
  ports:
    - port: 9092
      targetPort: 9092
