apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: smartpay

resources:
  - ../../base
labels:
  - pairs:
      environment: dev

# In dev, scale down all deployments to 1 replica, lift CPU limits (prevents
# cgroup throttling that stalls slow JVM startup on CI runners), and grant
# headroom for JPA/Kafka bootstrapping.
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: smartpay-gateway
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: gateway
                resources:
                  limits:
                    cpu: null
                    memory: 1Gi
                  requests:
                    cpu: 100m
                    memory: 256Mi
    target:
      kind: Deployment
      name: smartpay-gateway
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: smartpay-ledger-service
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: ledger
                resources:
                  limits:
                    cpu: null
                    memory: 1Gi
                  requests:
                    cpu: 100m
                    memory: 384Mi
    target:
      kind: Deployment
      name: smartpay-ledger-service
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: smartpay-payment-service
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: payment
                resources:
                  limits:
                    cpu: null
                    memory: 1Gi
                  requests:
                    cpu: 100m
                    memory: 256Mi
    target:
      kind: Deployment
      name: smartpay-payment-service
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: smartpay-invoice-service
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: invoice
                resources:
                  limits:
                    cpu: null
                    memory: 1Gi
                  requests:
                    cpu: 100m
                    memory: 256Mi
    target:
      kind: Deployment
      name: smartpay-invoice-service
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: smartpay-payout-worker
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: worker
                resources:
                  limits:
                    cpu: null
                    memory: 1Gi
                  requests:
                    cpu: 100m
                    memory: 256Mi
    target:
      kind: Deployment
      name: smartpay-payout-worker
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: smartpay-recon-service
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: recon
                resources:
                  limits:
                    cpu: null
                    memory: 1Gi
                  requests:
                    cpu: 100m
                    memory: 256Mi
    target:
      kind: Deployment
      name: smartpay-recon-service
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: smartpay-risk-service
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: risk
                resources:
                  limits:
                    cpu: null
                    memory: 1Gi
                  requests:
                    cpu: 100m
                    memory: 256Mi
    target:
      kind: Deployment
      name: smartpay-risk-service
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: smartpay-notification-service
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: notification
                resources:
                  limits:
                    cpu: null
                    memory: 1Gi
                  requests:
                    cpu: 100m
                    memory: 256Mi
    target:
      kind: Deployment
      name: smartpay-notification-service
