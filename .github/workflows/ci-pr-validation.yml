name: "CI - Pull Request Quality Gates"

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-unit-tests:
    name: "Fast Unit Tests (Java 25)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "maven"

      - name: Run Unit Tests & ArchUnit
        run: |
          mvn test -Punit --batch-mode --no-transfer-progress

  integration-tests:
    name: "Integration Tests (Testcontainers PostgreSQL 16)"
    needs: fast-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "maven"

      - name: Run Integration Tests
        run: |
          mvn test -Pintegration --batch-mode --no-transfer-progress

  kustomize-lint:
    name: "Kubernetes Kustomize Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kustomize & Kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Base and Overlays
        run: |
          echo "Validating k8s/base..."
          kubectl kustomize k8s/base > /dev/null

          echo "Validating k8s/overlays/dev..."
          kubectl kustomize k8s/overlays/dev > /dev/null

          echo "Validating k8s/overlays/staging..."
          kubectl kustomize k8s/overlays/staging > /dev/null

          echo "Validating k8s/overlays/prod..."
          kubectl kustomize k8s/overlays/prod > /dev/null

          echo "All Kustomize manifests validated successfully!"
