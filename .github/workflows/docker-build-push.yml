name: "CD - Container Build, Security Scan & Publish"

on:
  push:
    branches:
      - main
    paths:
      - "smartpay-**/**"
      - "pom.xml"
      - "docker/**"
      - "k8s/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-and-push:
    name: "Build & Scan ${{ matrix.module }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - smartpay-gateway
          - smartpay-ledger-service
          - smartpay-payment-service
          - smartpay-invoice-service
          - smartpay-payout-worker
          - smartpay-recon-service
          - smartpay-risk-service
          - smartpay-notification-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.module }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          build-args: |
            MODULE_NAME=${{ matrix.module }}
          load: true
          tags: ${{ matrix.module }}:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vulnerability Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.module }}:local
          format: "table"
          exit-code: "1" # Blocks deployment on CRITICAL vulnerabilities per AC-3
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"

      - name: Push Container Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          build-args: |
            MODULE_NAME=${{ matrix.module }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
