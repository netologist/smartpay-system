spring:
  application:
    name: smartpay-recon-service

  datasource:
    url: jdbc:postgresql://localhost:5432/smartpay_recon
    username: smartpay
    password: smartpay
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

smartpay:
  recon:
    ledger-grpc-host: ${LEDGER_GRPC_HOST:localhost}
    ledger-grpc-port: ${LEDGER_GRPC_PORT:9090}
