spring:
  datasource:
    # Overridden by @ServiceConnection / Testcontainers at runtime — these are fallbacks only.
    url: jdbc:tc:postgresql:16-alpine:///smartpay_ledger_test
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 30000

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations:
      - classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true


grpc:
  server:
    enabled: true
    port: 0
logging:
  level:
    com.hozgan.smartpay.ledger: DEBUG
    org.springframework.transaction: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO
