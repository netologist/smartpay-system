# ==============================================================================
# Kubernetes Migration Job: Flyway Database Schema Evolution
# Domain: TEG SmartPay Embedded FinTech Platform
# Pattern: Dedicated Pre-Deployment Migration Job (Sync Wave 1)
# Security: Principle of Least Privilege (DDL User vs DML User)
# ==============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: smartpay-flyway-migration
  namespace: smartpay
  labels:
    app.kubernetes.io/name: smartpay-flyway-migration
    app.kubernetes.io/part-of: smartpay-platform
    app.kubernetes.io/component: db-migration
  annotations:
    # ArgoCD Sync Wave 1: Runs BEFORE application deployments (Sync Wave 2)
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    # Helm Pre-Upgrade Hook (if deployed via Helm)
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  # Limit job execution to 5 minutes to prevent hanging pipelines
  activeDeadlineSeconds: 300
  # Retry up to 3 times on transient network failures
  backoffLimit: 3
  # Automatically clean up completed Job pod after 300 seconds
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smartpay-flyway-migration
    spec:
      restartPolicy: OnFailure
      # Security Context: Non-root user
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: flyway-migrator
          # Official lightweight Flyway Docker image with PostgreSQL driver
          image: flyway/flyway:10.15.0-alpine
          args:
            - "-connectRetries=10"
            - "-connectRetriesInterval=5"
            - "-lockRetryCount=10"
            - "migrate"
          env:
            # Database Host & Connection URL
            - name: FLYWAY_URL
              value: "jdbc:postgresql://postgres.smartpay.svc.cluster.local:5432/smartpay_db?sslmode=verify-full&sslrootcert=/etc/ssl/certs/db-ca.crt"
            # PRIVILEGED DDL USER (CREATE TABLE, ALTER TABLE, ADD CONSTRAINT)
            # Web/Runtime application pods NEVER receive these credentials!
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: smartpay-db-ddl-credentials
                  key: username
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartpay-db-ddl-credentials
                  key: password
            - name: FLYWAY_LOCATIONS
              value: "filesystem:/flyway/sql"
            - name: FLYWAY_BASELINE_ON_MIGRATE
              value: "true"
            - name: FLYWAY_VALIDATE_ON_MIGRATE
              value: "true"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            # Mount the Flyway migration scripts from ConfigMap
            - name: migration-scripts
              mountPath: /flyway/sql
              readOnly: true
            - name: db-ssl-cert
              mountPath: /etc/ssl/certs
              readOnly: true
      volumes:
        - name: migration-scripts
          configMap:
            name: smartpay-flyway-scripts
        - name: db-ssl-cert
          secret:
            secretName: postgres-ca-cert
