name: "CI - Pull Request Quality Gates"

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-unit-tests:
    name: "Quality Pipeline, ArchUnit & Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "maven"

      - name: Execute Quality Pipeline (Verify, Spotless, ArchUnit, JaCoCo)
        run: |
          mvn verify -Punit --batch-mode --no-transfer-progress

      - name: Upload JaCoCo HTML Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-html-coverage-reports
          path: "**/target/site/jacoco/**"
          retention-days: 7

      - name: Upload Surefire HTML Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-html-test-reports
          path: |
            **/target/reports/surefire.html
            **/target/surefire-reports/**
          retention-days: 7

  integration-tests:
    name: "Integration Tests (Testcontainers PostgreSQL 16)"
    needs: quality-and-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "maven"

      - name: Run Integration Tests
        run: |
          mvn test -Pintegration --batch-mode --no-transfer-progress

      - name: Upload Integration Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-reports
          path: "**/target/surefire-reports/**"
          retention-days: 7

  kustomize-lint:
    name: "Kubernetes Kustomize Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kustomize & Kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Base, Migrations and Overlays
        run: |
          echo "Validating k8s/base..."
          kubectl kustomize k8s/base > /dev/null

          echo "Validating k8s/migrations..."
          kubectl kustomize k8s/migrations > /dev/null

          echo "Validating k8s/overlays/dev..."
          kubectl kustomize k8s/overlays/dev > /dev/null

          echo "Validating k8s/overlays/staging..."
          kubectl kustomize k8s/overlays/staging > /dev/null

          echo "Validating k8s/overlays/prod..."
          kubectl kustomize k8s/overlays/prod > /dev/null

          echo "All Kustomize manifests validated successfully!"
