apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: smartpay-default-isolation
  namespace: smartpay
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic between pods in the smartpay namespace
    - from:
        - podSelector: {}
    # Allow ingress controller traffic
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
  egress:
    # Allow internal cluster DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow communication within smartpay namespace (DB, Redpanda, gRPC)
    - to:
        - podSelector: {}
