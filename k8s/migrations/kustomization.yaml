# ==============================================================================
# Kustomization: per-service Flyway migration Jobs + migration-script ConfigMaps
# ==============================================================================
# ArgoCD/Helm Sync Wave 1 — runs BEFORE application deployments (Sync Wave 2).
# Each Job migrates exactly one service's PostgreSQL schema ("ledger",
# "invoice", "payment", "recon", "gateway") inside the shared smartpay_db.
#
# ConfigMaps are generated by scripts/ci/sync-flyway-configmaps.sh from each
# module's src/main/resources/db/migration folder (single source of truth).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - smartpay-ledger-flyway-migration.yaml
  - smartpay-invoice-flyway-migration.yaml
  - smartpay-payment-flyway-migration.yaml
  - smartpay-recon-flyway-migration.yaml
  - smartpay-gateway-flyway-migration.yaml
  - smartpay-risk-flyway-migration.yaml
  - smartpay-notification-flyway-migration.yaml
  - configmaps/smartpay-ledger-flyway-scripts.yaml
  - configmaps/smartpay-invoice-flyway-scripts.yaml
  - configmaps/smartpay-payment-flyway-scripts.yaml
  - configmaps/smartpay-recon-flyway-scripts.yaml
  - configmaps/smartpay-gateway-flyway-scripts.yaml
  - configmaps/smartpay-risk-flyway-scripts.yaml
  - configmaps/smartpay-notification-flyway-scripts.yaml
