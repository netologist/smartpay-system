# ==============================================================================
# Ephemeral KinD Infrastructure: Redpanda (Single-Node Kafka Wire-Compatible Broker)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: smartpay
  labels:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/component: message-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
          command:
            - redpanda
            - start
            - --mode
            - dev-container
            - --smp
            - "1"
            - --memory
            - 768M
            - --reserve-memory
            - 0M
            - --check=false
            - --kafka-addr
            - PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr
            - PLAINTEXT://redpanda.smartpay.svc.cluster.local:9092
            - --default-log-level=info
          ports:
            - name: kafka
              containerPort: 9092
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          readinessProbe:
            exec:
              command:
                - rpk
                - cluster
                - health
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 15
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: smartpay
  labels:
    app.kubernetes.io/name: redpanda
spec:
  type: ClusterIP
  selector:
    app: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
