# ==============================================================================
# Spring Boot Configuration Profile: migrator
# Target: Single-Run Kubernetes Job or Standalone Migration CLI
# Security: Uses Privileged DDL User Credentials
# ==============================================================================
spring:
  config:
    activate:
      on-profile: migrator
  datasource:
    url: ${MIGRATION_DB_URL:jdbc:postgresql://localhost:5432/smartpay_db}
    username: ${MIGRATION_DB_USER:smartpay_ddl_admin}
    password: ${MIGRATION_DB_PASS:secure_ddl_password}
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      connection-timeout: 30000
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
    connect-retries: 10
    connect-retries-interval: 5
    lock-retry-count: 10
  jpa:
    hibernate:
      ddl-auto: validate
