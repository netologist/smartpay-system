spring:
  main:
    allow-bean-definition-overriding: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: recon
    open-in-view: false
  flyway:
    enabled: true
    create-schemas: true
    schemas: recon
    default-schema: recon

smartpay:
  recon:
    ledger-grpc-host: localhost
    ledger-grpc-port: 19090
